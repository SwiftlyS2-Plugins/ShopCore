name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  # No version input: the release version always comes from PluginMetadata in ShopCore/src/ShopCore.cs.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          MAIN_CS="ShopCore/src/ShopCore.cs"
          RAW=$(sed -n '/\[PluginMetadata(/,/)]/ s/^.*\bVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' "${MAIN_CS}" | head -n 1)
          RAW="${RAW#v}"

          if [[ -z "${RAW}" ]]; then
            echo "::error file=${MAIN_CS}::Could not read PluginMetadata.Version."
            exit 1
          fi

          TAG="v${RAW}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "::error file=${MAIN_CS}::Pushed tag ${GITHUB_REF_NAME} does not match PluginMetadata.Version (${TAG}). Delete the tag, make them agree, and push it again."
            exit 1
          fi

          if [[ "${RAW}" == *"-"* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "Version ${RAW} -> tag ${TAG} (prerelease: ${PRERELEASE})"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error file=ShopCore/src/ShopCore.cs::Release ${TAG} already exists. Bump PluginMetadata.Version to publish a new release."
            exit 1
          fi

      - name: Ensure Tag Exists (manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
            if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "::error file=ShopCore/src/ShopCore.cs::Tag ${TAG} already exists at ${TAG_SHA}, not at ${GITHUB_SHA}. Bump PluginMetadata.Version, or delete the unreleased tag and re-run."
              exit 1
            fi
            echo "Tag ${TAG} already exists at ${GITHUB_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

      - name: Build
        shell: bash
        run: |
          rm -rf build
          SOLUTION=$(find . -maxdepth 2 -type f -name "*.sln" | head -n 1 || true)

          if [[ -n "${SOLUTION}" ]]; then
            echo "Using solution: ${SOLUTION}"
            dotnet restore "${SOLUTION}"
            dotnet build "${SOLUTION}" -c Release --nologo --no-restore
            exit 0
          fi

          echo "No .sln found in repository; building projects directly."
          shopt -s nullglob
          PROJECTS=(
            "ShopCore.Contract/ShopCore.Contract.csproj"
            "ShopCore/ShopCore.csproj"
            Modules/*/*.csproj
          )

          if [[ ${#PROJECTS[@]} -eq 0 ]]; then
            echo "No projects found to build."
            exit 1
          fi

          for PROJECT in "${PROJECTS[@]}"; do
            if [[ -f "${PROJECT}" ]]; then
              echo "Building ${PROJECT}"
              dotnet restore "${PROJECT}"
              dotnet build "${PROJECT}" -c Release --nologo --no-restore
            fi
          done

      - name: Create Release Archive
        id: archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CORE_ARCHIVE="ShopCore v${VERSION}.zip"
          MODULES_ARCHIVE="Modules.zip"

          rm -rf release_bundle
          mkdir -p release_bundle/core
          mkdir -p release_bundle/modules/Modules

          if [[ ! -d "build/plugins/ShopCore" ]]; then
            echo "Missing build/plugins/ShopCore in build output."
            exit 1
          fi

          cp -R "build/plugins/ShopCore" "release_bundle/core/ShopCore"

          if [[ -d "build/plugins" ]]; then
            shopt -s nullglob
            for PLUGIN_DIR in build/plugins/*; do
              NAME="$(basename "${PLUGIN_DIR}")"
              if [[ "${NAME}" == "ShopCore" ]]; then
                continue
              fi

              if [[ -d "${PLUGIN_DIR}" ]]; then
                cp -R "${PLUGIN_DIR}" "release_bundle/modules/Modules/${NAME}"
              fi
            done
          fi

          (
            cd release_bundle/core
            zip -r "../../${CORE_ARCHIVE}" ShopCore
          )

          (
            cd release_bundle/modules
            zip -r "../../${MODULES_ARCHIVE}" Modules
          )

          echo "core_archive=${CORE_ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "modules_archive=${MODULES_ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"

          if [[ "${PRERELEASE}" == "true" ]]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)
          else
            PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n 1 || true)
          fi

          {
            echo "## Changes in v${VERSION}"
            echo

            if [[ -n "${PREV_TAG}" ]]; then
              echo "_Compared to ${PREV_TAG}_"
              echo
              RANGE="${PREV_TAG}..${TAG}"
            else
              echo "_First release_"
              echo
              RANGE="${TAG}"
            fi

            COMMITS=$(git log "${RANGE}" --pretty=format:'- %s ([`%h`](https://github.com/${{ github.repository }}/commit/%H))')
            if [[ -z "${COMMITS}" ]]; then
              echo "- No commit details found for this range."
            else
              echo "${COMMITS}"
            fi
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body_path: release_notes.md
          files: |
            ${{ steps.archive.outputs.core_archive }}
            ${{ steps.archive.outputs.modules_archive }}
